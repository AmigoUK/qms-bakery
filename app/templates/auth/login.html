{% extends "base.html" %}
{% from "_macros.html" import field_errors %}
{% block title_suffix %} · {{ _('auth.login.title') }}{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h1>{{ _('auth.login.title') }}</h1>
  {% if error %}<div class="flash flash-danger">{{ error }}</div>{% endif %}
  <form method="post" novalidate>
    {{ form.csrf_token }}
    <label>
      <span>{{ _('auth.login.email') }}</span>
      {{ form.email(autocomplete="username", required=True, type="email",
                    **{'aria-invalid': 'true' if form.email.errors else 'false',
                       'aria-describedby': form.email.id ~ '-errors' if form.email.errors else None}) }}
      {{ field_errors(form.email) }}
    </label>
    <label>
      <span>{{ _('auth.login.password') }}</span>
      {{ form.password(autocomplete="current-password", required=True,
                       **{'aria-invalid': 'true' if form.password.errors else 'false',
                          'aria-describedby': form.password.id ~ '-errors' if form.password.errors else None}) }}
      {{ field_errors(form.password) }}
    </label>
    <button class="btn btn-primary" type="submit">{{ _('auth.login.submit') }}</button>
  </form>
  <p class="subtitle">
    <a href="{{ url_for('legal.privacy') }}">{{ _('legal.privacy') }}</a>
  </p>
</div>
{% endblock %}
