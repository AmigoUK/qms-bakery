name: security

# Runs pip-audit against the project's declared dependencies. Fires on:
#   - every push to main + every PR (catches a new vulnerable dep before it lands),
#   - a weekly schedule (catches already-deployed deps when a CVE is published
#     for them later -- pip-audit's most-valuable mode).
#
# This workflow does not consume any untrusted GitHub event inputs (no
# issue/PR titles, no commit messages) in shell commands, so workflow
# injection (https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/)
# does not apply here.

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - '.github/workflows/security.yml'
  schedule:
    # Mondays 06:00 UTC -- early in the week so a weekend-published CVE is
    # surfaced before the team starts cutting releases.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install project + dev deps
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: pip-audit
        run: |
          # --strict: also fail when an advisory has no known fix yet.
          # Add deferrals via --ignore-vuln GHSA-xxxx-xxxx-xxxx with a
          # comment explaining why and a removal date. Currently empty.
          ./.venv/bin/pip-audit --strict
