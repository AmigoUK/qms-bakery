services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
      POSTGRES_DB: qms
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://qms:qms@postgres:5432/qms
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      FLASK_APP: app:create_app
    ports:
      - "${APP_PORT:-8000}:8000"
    command: sh -c "flask db upgrade && exec gunicorn -w ${GUNICORN_WORKERS:-4} -b ${GUNICORN_BIND:-0.0.0.0:8000} 'app:create_app()'"
    healthcheck:
      # Healthcheck runs inside the container, so the host APP_PORT doesn't
      # apply. If you change GUNICORN_BIND off the default :8000, update
      # this URL too.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mqtt-bridge:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      app:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://qms:qms@postgres:5432/qms
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      FLASK_APP: app:create_app
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
    restart: unless-stopped
    command: flask mqtt-bridge

  trigger-worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://qms:qms@postgres:5432/qms
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      FLASK_APP: app:create_app
      WORKER_NAME: trigger-worker-1
    restart: unless-stopped
    command: flask trigger-worker

  rq-worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://qms:qms@postgres:5432/qms
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      FLASK_APP: app:create_app
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-0}
      SMTP_FROM: ${SMTP_FROM:-qms@local}
      CLICKSEND_USERNAME: ${CLICKSEND_USERNAME:-}
      CLICKSEND_API_KEY: ${CLICKSEND_API_KEY:-}
      CLICKSEND_SOURCE: ${CLICKSEND_SOURCE:-QMS}
      CLICKSEND_BASE_URL: ${CLICKSEND_BASE_URL:-https://rest.clicksend.com/v3}
    restart: unless-stopped
    command: flask rq-worker

  training-scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://qms:qms@postgres:5432/qms
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      FLASK_APP: app:create_app
      TRAINING_LINK_SIGNING_KEY: ${TRAINING_LINK_SIGNING_KEY:-}
      TRAINING_BASE_URL: ${TRAINING_BASE_URL:-}
      TRAINING_SCHEDULER_POLL_SECONDS: ${TRAINING_SCHEDULER_POLL_SECONDS:-60}
      CLICKSEND_USERNAME: ${CLICKSEND_USERNAME:-}
      CLICKSEND_API_KEY: ${CLICKSEND_API_KEY:-}
      CLICKSEND_SOURCE: ${CLICKSEND_SOURCE:-QMS}
      CLICKSEND_BASE_URL: ${CLICKSEND_BASE_URL:-https://rest.clicksend.com/v3}
    restart: unless-stopped
    command: flask training-scheduler

volumes:
  pgdata:
